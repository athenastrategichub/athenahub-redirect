
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Athena Strategic Hub | Think. Train. Endure.</title>
  <meta
    name="description"
    content="Athena Strategic Hub — Building a culture of strategic thinking, continuous learning, and professional excellence."
  />

  <style>
    /* ================= GLOBAL ================= */

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: "Inter", -apple-system, BlinkMacSystemFont,
        "Segoe UI", Arial, sans-serif;
      color: #0f172a;
      line-height: 1.5;
      background-color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    .content-wrapper {
      max-width: 1100px;
      margin: 0 auto;
      width: 90%;
    }

    a {
      text-decoration: none;
    }

    /* ================= HEADER / NAV ================= */

    .header {
      padding: 16px 0;
      border-bottom: 1px solid #f1f5f9;
      background-color: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-wrapper {
      max-width: 1100px;
      margin: 0 auto;
      width: 90%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .logo {
      font-size: 18px;
      font-weight: 800;
      color: #2563eb;
      letter-spacing: -0.5px;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .text-link {
      color: #64748b;
      font-weight: 600;
      font-size: 13px;
      transition: color 0.2s ease;
    }

    .text-link:hover {
      color: #2563eb;
    }

    /* ================= MAIN ================= */

    main {
      flex: 1;
      width: 100%;
    }

    /* ================= HERO SECTION ================= */

    .hero-section {
      padding: 80px 0 50px;
      text-align: center;
    }

    .badge {
      display: inline-block;
      padding: 4px 10px;
      background: #eff6ff;
      color: #2563eb;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 16px;
      letter-spacing: 0.04em;
    }

    .hero-title {
      font-size: clamp(32px, 5vw, 56px);
      font-weight: 850;
      line-height: 1.1;
      letter-spacing: -0.03em;
      margin: 0;
      color: #0f172a;
    }

    .hero-description {
      font-size: 17px;
      color: #475569;
      max-width: 620px;
      margin: 20px auto 0;
    }

    /* ================= OUR PLATFORMS ================= */

    .platforms-section {
      padding: 40px 0 80px;
      text-align: center;
    }

    .section-title {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #94a3b8;
      margin: 0 0 28px;
    }

    .platform-grid {
      display: flex;
      justify-content: center;
    }

    .platform-card {
      padding: 32px 28px;
      background-color: #f8fafc;
      border-radius: 16px;
      text-align: left;
      border: 1px solid #e2e8f0;
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        border-color 0.2s ease;
    }

    .platform-card:hover {
      transform: translateY(-3px);
      border-color: #bfdbfe;
      box-shadow: 0 12px 30px -12px rgba(15, 23, 42, 0.12);
    }

    .card-title {
      font-size: 20px;
      font-weight: 800;
      color: #0f172a;
      margin: 0 0 8px;
      letter-spacing: -0.01em;
    }

    .card-description {
      font-size: 14px;
      color: #64748b;
      margin: 0 0 24px;
    }

    .main-cta {
      display: inline-block;
      padding: 12px 24px;
      background-color: #2563eb;
      color: #fff;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.2);
      transition:
        background-color 0.2s ease,
        transform 0.2s ease;
    }

    .main-cta:hover {
      background-color: #1d4ed8;
      transform: translateY(-1px);
    }

    .main-cta:focus-visible,
    .text-link:focus-visible {
      outline: 3px solid #93c5fd;
      outline-offset: 4px;
    }

    /* ================= FOOTER ================= */

    .footer {
      padding: 32px 0;
      border-top: 1px solid #f1f5f9;
      text-align: center;
      color: #94a3b8;
      font-size: 13px;
      margin-top: auto;
    }

    .footer p {
      margin: 0;
    }

    /* ================= MOBILE RESPONSIVE ================= */

    @media (max-width: 600px) {
      .header {
        padding: 14px 0;
      }

      .logo {
        font-size: 16px;
      }

      .text-link {
        font-size: 12px;
      }

      .hero-section {
        padding: 72px 0 40px;
      }

      .hero-title {
        font-size: clamp(32px, 9vw, 44px);
      }

      .hero-description {
        font-size: 15px;
        line-height: 1.7;
      }

      .platforms-section {
        padding: 30px 0 64px;
      }

      .platform-card {
        padding: 28px 24px;
      }

      .card-title {
        font-size: 19px;
      }

      .main-cta {
        width: 100%;
        text-align: center;
      }

      .footer {
        padding: 24px 0;
        font-size: 12px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      .platform-card,
      .main-cta,
      .text-link {
        transition: none;
      }
    }
  </style>
</head>

<body>

  <!-- ================= HEADER ================= -->

  <header class="header">
    <div class="nav-wrapper">

      <div class="logo">
        Athena Hub
      </div>

      <nav class="nav-links" aria-label="Main navigation">
        <a
          href="https://aps.athenahub.id/"
          target="_blank"
          rel="noopener noreferrer"
          class="text-link"
        >
          Buka APS ↗
        </a>
      </nav>

    </div>
  </header>

  <!-- ================= MAIN CONTENT ================= -->

  <main>

    <!-- HERO SECTION -->

    <section class="hero-section">
      <div class="content-wrapper">

        <div class="badge">
          WELCOME TO ATHENA
        </div>

        <h1 class="hero-title">
          Think. Train. Endure.
        </h1>

        <p class="hero-description">
          Building a culture of strategic thinking,
          continuous learning, and professional excellence.
        </p>

      </div>
    </section>

    <!-- OUR PLATFORMS -->

    <section class="platforms-section" id="platforms">
      <div class="content-wrapper">

        <h2 class="section-title">
          OUR PLATFORMS
        </h2>

        <div class="platform-grid">

          <div class="platform-card">

            <h3 class="card-title">
              Athena Practice System
            </h3>

            <p class="card-description">
              Professional learning &amp; exam preparation.
            </p>

            <a
              href="https://aps.athenahub.id/"
              target="_blank"
              rel="noopener noreferrer"
              class="main-cta"
            >
              Explore APS ↗
            </a>

          </div>

        </div>
      </div>
    </section>

  </main>

  <!-- ================= FOOTER ================= -->

  <footer class="footer">
    <div class="content-wrapper">
      <p>
        © <span id="current-year">2026</span>
        Athena Hub. All rights reserved.
      </p>
    </div>
  </footer>

  <script>
    document.getElementById("current-year").textContent =
      new Date().getFullYear();
  </script>

</body>
</html>
